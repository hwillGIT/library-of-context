<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" style="max-width:100%;height:auto" role="img" aria-labelledby="title desc">
  <title id="title">The Library of Context virtual-memory architecture</title>
  <desc id="desc">A didactic architecture diagram showing durable context books stored in SQLite, hot books cached in Redis and process RAM, and a fixed-size reading desk supplied to the model by hybrid retrieval and page replacement.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f4e8"/>
      <stop offset="1" stop-color="#edf5f2"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173f48"/>
      <stop offset="1" stop-color="#0d2d35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#15323a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#277b79"/>
    </marker>
    <marker id="return-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#c5773e"/>
    </marker>
    <style>
      .sans { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .serif { font-family: Georgia, Times New Roman, serif; }
      .small { font-size: 18px; }
      .label { font-size: 20px; font-weight: 700; letter-spacing: .02em; }
      .muted { fill: #567078; }
      .ink { fill: #163039; }
      .cream { fill: #fffdf7; }
      .panel { fill: #fffdf7; stroke: #cad9d4; stroke-width: 2; }
      .arrow { fill: none; stroke: #277b79; stroke-width: 5; marker-end: url(#arrow); }
      .return { fill: none; stroke: #c5773e; stroke-width: 4; stroke-dasharray: 12 9; marker-end: url(#return-arrow); }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#background)"/>
  <circle cx="1490" cy="95" r="175" fill="#d9ebe4" opacity=".55"/>
  <circle cx="90" cy="900" r="190" fill="#f1ddbd" opacity=".5"/>

  <text x="80" y="78" class="serif ink" font-size="52" font-weight="700">The Library of Context</text>
  <text x="82" y="118" class="sans muted" font-size="23">Virtual memory for an AI: a very large local library, a deliberately small reading desk.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="185" width="430" height="490" rx="26" class="panel"/>
    <text x="112" y="230" class="sans label ink">L3 · LIBRARY SHELVES</text>
    <text x="112" y="260" class="sans small muted">SQLite on disk · durable source of truth</text>

    <g transform="translate(118 303)">
      <rect width="350" height="302" rx="12" fill="#e8ded0" stroke="#bc9b72" stroke-width="3"/>
      <path d="M20 92H330M20 190H330M20 282H330" stroke="#8a6746" stroke-width="8" stroke-linecap="round"/>
      <g stroke="#fffdf7" stroke-width="2">
        <rect x="32" y="25" width="33" height="63" rx="3" fill="#277b79"/>
        <rect x="70" y="17" width="28" height="71" rx="3" fill="#9eb0aa"/>
        <rect x="103" y="33" width="38" height="55" rx="3" fill="#c5773e"/>
        <rect x="146" y="13" width="31" height="75" rx="3" fill="#d4b15b"/>
        <rect x="182" y="29" width="42" height="59" rx="3" fill="#9eb0aa"/>
        <rect x="229" y="21" width="30" height="67" rx="3" fill="#277b79"/>
        <rect x="264" y="35" width="48" height="53" rx="3" fill="#9eb0aa"/>

        <rect x="31" y="119" width="43" height="67" rx="3" fill="#9eb0aa"/>
        <rect x="79" y="137" width="29" height="49" rx="3" fill="#277b79"/>
        <rect x="113" y="109" width="37" height="77" rx="3" fill="#9eb0aa"/>
        <rect x="155" y="127" width="44" height="59" rx="3" fill="#d4b15b"/>
        <rect x="204" y="115" width="31" height="71" rx="3" fill="#c5773e"/>
        <rect x="240" y="131" width="34" height="55" rx="3" fill="#9eb0aa"/>
        <rect x="279" y="103" width="33" height="83" rx="3" fill="#277b79"/>

        <rect x="32" y="221" width="31" height="57" rx="3" fill="#d4b15b"/>
        <rect x="68" y="207" width="44" height="71" rx="3" fill="#9eb0aa"/>
        <rect x="117" y="231" width="29" height="47" rx="3" fill="#277b79"/>
        <rect x="151" y="215" width="36" height="63" rx="3" fill="#9eb0aa"/>
        <rect x="192" y="201" width="32" height="77" rx="3" fill="#c5773e"/>
        <rect x="229" y="225" width="47" height="53" rx="3" fill="#9eb0aa"/>
        <rect x="281" y="211" width="31" height="67" rx="3" fill="#d4b15b"/>
      </g>
    </g>
    <text x="112" y="642" class="sans small muted">Millions of books can remain addressable here.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="610" y="198" width="300" height="205" rx="24" class="panel"/>
    <text x="640" y="240" class="sans label ink">L2 · NEARBY STACKS</text>
    <text x="640" y="269" class="sans small muted">Local Redis · shared hot set</text>
    <g transform="translate(642 304)">
      <rect x="0" y="56" width="224" height="30" rx="7" fill="#9cc9be"/>
      <rect x="18" y="25" width="206" height="30" rx="7" fill="#62a79e"/>
      <rect x="0" y="-6" width="224" height="30" rx="7" fill="#277b79"/>
      <text x="15" y="15" class="sans cream" font-size="16">deploy runbook</text>
      <text x="33" y="46" class="sans ink" font-size="16">CI logs</text>
      <text x="15" y="77" class="sans ink" font-size="16">service map</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="610" y="470" width="300" height="205" rx="24" class="panel"/>
    <text x="640" y="512" class="sans label ink">L1 · LIBRARIAN CART</text>
    <text x="640" y="541" class="sans small muted">Process RAM · byte-bounded LRU</text>
    <g transform="translate(642 580)">
      <rect x="0" y="35" width="224" height="34" rx="7" fill="#62a79e"/>
      <rect x="18" y="0" width="206" height="34" rx="7" fill="#277b79"/>
      <text x="33" y="23" class="sans cream" font-size="16">CI logs</text>
      <text x="15" y="58" class="sans ink" font-size="16">deploy runbook</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="1010" y="185" width="510" height="490" rx="28" fill="url(#desk)"/>
    <text x="1048" y="231" class="sans" font-size="23" font-weight="750" fill="#fffdf7">THE READING DESK</text>
    <text x="1048" y="263" class="sans" font-size="19" fill="#b9d9d3">Model-visible context · fixed 4,000-token budget</text>
    <rect x="1048" y="303" width="434" height="74" rx="12" fill="#fffdf7"/>
    <rect x="1048" y="391" width="434" height="74" rx="12" fill="#d9ebe4"/>
    <rect x="1048" y="479" width="434" height="74" rx="12" fill="#d9ebe4"/>
    <rect x="1048" y="567" width="434" height="58" rx="12" fill="none" stroke="#789aa1" stroke-width="3" stroke-dasharray="9 8"/>
    <text x="1072" y="333" class="sans ink" font-size="17" font-weight="700">CURRENT REQUEST</text>
    <text x="1072" y="359" class="sans muted" font-size="17">Why did the deployment fail?</text>
    <text x="1072" y="434" class="sans ink" font-size="19">CI logs</text>
    <text x="1072" y="522" class="sans ink" font-size="19">deploy runbook</text>
    <text x="1072" y="604" class="sans" font-size="17" fill="#b9d9d3">free slot · capacity does not grow</text>
    <text x="1048" y="654" class="sans" font-size="17" fill="#d8b96f">2,740 / 4,000 tokens · 3 of 4 slots</text>
  </g>

  <path d="M510 316C555 316 560 298 610 298" class="arrow"/>
  <text x="560" y="282" class="sans muted" font-size="17" text-anchor="middle">retrieve</text>
  <path d="M760 403V470" class="arrow"/>
  <text x="808" y="443" class="sans muted" font-size="17">promote</text>
  <path d="M910 574C955 574 965 430 1010 430" class="arrow"/>
  <text x="962" y="480" class="sans muted" font-size="17" text-anchor="middle">page in</text>
  <path d="M1265 675V716H294V675" class="return"/>
  <text x="780" y="709" class="sans" fill="#a65e30" font-size="18" text-anchor="middle">swap out irrelevant books · replace the previous desk, never append forever</text>

  <g transform="translate(80 782)">
    <rect width="460" height="130" rx="20" fill="#fffdf7" stroke="#cad9d4" stroke-width="2"/>
    <circle cx="45" cy="43" r="24" fill="#277b79"/>
    <text x="45" y="51" class="sans cream" font-size="22" font-weight="700" text-anchor="middle">1</text>
    <text x="84" y="39" class="sans ink" font-size="20" font-weight="700">SHELVE</text>
    <text x="84" y="68" class="sans muted" font-size="18">Chunk, embed, and write through to SQLite.</text>
    <text x="84" y="98" class="sans muted" font-size="18">Warm copies may enter RAM and Redis.</text>
  </g>
  <g transform="translate(570 782)">
    <rect width="460" height="130" rx="20" fill="#fffdf7" stroke="#cad9d4" stroke-width="2"/>
    <circle cx="45" cy="43" r="24" fill="#277b79"/>
    <text x="45" y="51" class="sans cream" font-size="22" font-weight="700" text-anchor="middle">2</text>
    <text x="84" y="39" class="sans ink" font-size="20" font-weight="700">CONSULT</text>
    <text x="84" y="68" class="sans muted" font-size="18">Hybrid RAG ranks semantic, lexical,</text>
    <text x="84" y="98" class="sans muted" font-size="18">important, and recent books.</text>
  </g>
  <g transform="translate(1060 782)">
    <rect width="460" height="130" rx="20" fill="#fffdf7" stroke="#cad9d4" stroke-width="2"/>
    <circle cx="45" cy="43" r="24" fill="#c5773e"/>
    <text x="45" y="51" class="sans cream" font-size="22" font-weight="700" text-anchor="middle">3</text>
    <text x="84" y="39" class="sans ink" font-size="20" font-weight="700">SWAP</text>
    <text x="84" y="68" class="sans muted" font-size="18">Pack the best books into a hard budget.</text>
    <text x="84" y="98" class="sans muted" font-size="18">Report in, out, and retained pages.</text>
  </g>

  <text x="800" y="955" class="sans ink" font-size="20" font-weight="700" text-anchor="middle">The library grows. The reading desk does not.</text>
</svg>
