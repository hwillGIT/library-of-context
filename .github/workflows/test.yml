name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Static quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install quality toolchain
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check context_cache library_of_context tests examples
      - name: Check formatting
        run: ruff format --check context_cache library_of_context tests examples

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q context_cache library_of_context
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Smoke test governed example
        run: python examples/governed_loop.py

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install documentation toolchain
        run: python -m pip install -e ".[docs]"
      - name: Build generated API and narrative documentation
        run: mkdocs build --strict
