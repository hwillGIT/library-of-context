name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install quality toolchain
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check context_cache library_of_context tests examples
      - name: Check formatting
        run: ruff format --check context_cache library_of_context tests examples
      - name: Check spelling
        run: codespell .
      - name: Check technical language
        run: >-
          python -B
          .agents/skills/write-timeless-technical-prose/scripts/check_technical_prose.py
          .

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q context_cache library_of_context
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Smoke test normal-user quickstart
        run: python -m library_of_context quickstart
      - name: Smoke test governed example
        run: python examples/governed_loop.py

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install documentation toolchain
        run: python -m pip install -e ".[docs]"
      - name: Build generated API and narrative documentation
        run: mkdocs build --strict
