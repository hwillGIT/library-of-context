name: Research question
description: Invite evidence and multiple design options for an open problem
title: "[Research]: "
labels: [research]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: State one answerable design or evaluation question.
    validations:
      required: true
  - type: textarea
    id: importance
    attributes:
      label: Why it matters
      description: Which agent, user, reliability, privacy, or scaling outcome depends on it?
    validations:
      required: true
  - type: textarea
    id: skeptical_case
    attributes:
      label: Why not or why defer
      description: What complexity, failure, privacy, quality, or operating cost could make the change worse than the current design?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Existing evidence
      description: Measurements, papers, implementations, or observations already available.
  - type: textarea
    id: options
    attributes:
      label: Candidate approaches
      description: List competing options, including keeping the current design, and important contradictions.
    validations:
      required: true
  - type: textarea
    id: trigger
    attributes:
      label: Adoption trigger
      description: What observable workload, failure, or quality threshold would justify acting?
    validations:
      required: true
  - type: textarea
    id: experiment
    attributes:
      label: Proposed experiment or decision rule
      description: What result would distinguish the options and permit rejection as well as acceptance?
    validations:
      required: true
