name: Feature proposal
description: Propose a bounded improvement with a clear contract
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which user or agent problem needs to be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the public contract, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: why_now
    attributes:
      label: Why now and adoption trigger
      description: What evidence or measurable condition makes the added complexity worthwhile now?
    validations:
      required: true
  - type: textarea
    id: why_not
    attributes:
      label: Why not, costs, and non-goals
      description: When is the current design better, what new failures or operational costs appear, and what is deliberately out of scope?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
      description: Include at least one viable alternative and the option to defer or keep the current design.
    validations:
      required: true
  - type: textarea
    id: invariants
    attributes:
      label: Invariants and failure behavior
      description: Durability, budget, privacy, ordering, offline behavior, and recovery impact.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Evidence gate
      description: Which correctness, quality, resource, failure, privacy, and migration results would justify accepting or rejecting the proposal?
    validations:
      required: true
