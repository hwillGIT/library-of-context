name: Feature proposal
description: Propose a bounded improvement with a clear contract
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which user or agent problem needs to be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the public contract, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
      description: Include at least one viable alternative when possible.
  - type: textarea
    id: invariants
    attributes:
      label: Invariants and failure behavior
      description: Durability, budget, privacy, ordering, offline behavior, and recovery impact.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: How should correctness, retrieval quality, and performance be tested?
