services:
  redis:
    image: redis:7-alpine
    container_name: library-of-context-redis
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${LIBRARY_OF_CONTEXT_REDIS_MEMORY:-4gb}
      - --maxmemory-policy
      - allkeys-lfu
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 20
    restart: unless-stopped
